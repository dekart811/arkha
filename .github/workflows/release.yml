# Builds a release's files when its tag (v1.0.0) is pushed: the prebuilt
# program for the AUR's arkha-bin (arkha-<version>-x86_64.tar.gz), the .deb
# (built on Debian 13, also for Ubuntu 26.04), the .rpm (Fedora) and the
# Arch Linux package (.pkg.tar.zst), with their SHA-256 sums, and puts
# them on a draft release: write its notes and publish it on GitHub. The
# notes start with .github/release-notes.md (the downloads, and the advice
# for packagers), then GitHub's list of changes. The tag has to match
# Cargo.toml's version, and the packages are only built once the checks
# (build, tests, clippy, translations) have passed for the commit: CI's
# result for it, waited for if CI is still at it; they're run here only if
# CI never ran for that commit.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag $GITHUB_REF_NAME doesn't match Cargo.toml's version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # CI's check job for this commit: passed, failed, still running, or none.
  ci:
    name: CI's checks for this commit
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.ci.outputs.passed }}
    steps:
      - id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          job="Build, tests, clippy, translations"
          for i in $(seq 1 90); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$run" ]; then
              state=$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json jobs --jq ".jobs[] | select(.name == \"$job\") | \"\(.status) \(.conclusion)\"")
              case "$state" in
                "completed success")
                  echo "CI's checks passed for this commit (run $run): not run again."
                  echo "passed=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
                "completed failure")
                  echo "::error::CI's checks failed for this commit (run $run): no packages."
                  exit 1 ;;
                completed*)
                  echo "CI's checks didn't finish for this commit ($state): they run here."
                  echo "passed=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
              esac
            elif [ "$i" -ge 9 ]; then
              # CI starts with the same push; none after three minutes: none at all.
              echo "No CI run for this commit: the checks run here."
              echo "passed=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 20
          done
          echo "::error::CI's checks for this commit didn't finish in 30 minutes."
          exit 1

  # Only if CI didn't check this commit.
  check:
    name: Build, tests, clippy, translations
    needs: ci
    if: needs.ci.outputs.passed != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK 3 and gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev gettext
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable, 2026-11-15
        with:
          components: clippy
      - name: Build
        run: cargo build --locked
      - name: Tests
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Translations
        run: |
          for po in po/*.po; do
            msgfmt --check --statistics -o /dev/null "$po"
          done
      - name: Placeholders
        run: python3 tools/check-placeholders.py

  tarball:
    name: Prebuilt program (x86_64)
    needs: [version, ci, check]
    # Also when check was skipped (CI had passed), not when anything failed.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK 3 and gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev gettext
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable, 2026-11-15
      - name: Build
        # A release's About window shows just its version (see build.rs).
        run: ARKHA_BUILD= packaging/tarball/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: target/tarball/*.tar.gz
          if-no-files-found: error

  deb:
    name: Debian package
    needs: [version, ci, check]
    # Also when check was skipped (CI had passed), not when anything failed.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    container: debian:13
    steps:
      - name: Install the build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git cargo rustc libgtk-3-dev gettext pkg-config build-essential dpkg-dev
      - uses: actions/checkout@v7
      - name: Build
        run: ARKHA_BUILD= sh packaging/deb/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: target/deb/*.deb
          if-no-files-found: error

  rpm:
    name: Fedora package
    needs: [version, ci, check]
    # Also when check was skipped (CI had passed), not when anything failed.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Install the build dependencies
        run: dnf install -y git cargo rust gcc gtk3-devel gettext rpm-build
      - uses: actions/checkout@v7
      - name: Build
        run: ARKHA_BUILD= sh packaging/rpm/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: rpm
          path: target/rpm/*.rpm
          if-no-files-found: error

  arch:
    name: Arch Linux package
    needs: [version, ci, check]
    # Also when check was skipped (CI had passed), not when anything failed.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install the build dependencies
        run: pacman -Syu --noconfirm --needed base-devel git cargo gettext gtk3 gvfs hicolor-icon-theme
      # The whole history and the tags: the PKGBUILD's version comes from them.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # makepkg won't run as root.
      - name: Build
        run: |
          useradd -m builder
          chown -R builder: .
          su builder -c 'cd packaging/arch && ARKHA_BUILD= makepkg --noconfirm'
      - uses: actions/upload-artifact@v7
        with:
          name: arch
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: Draft release
    needs: [version, ci, check, tarball, deb, rpm, arch]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # For the notes on the release page (.github/release-notes.md).
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Arkha $VERSION" \
            --notes-file .github/release-notes.md --generate-notes
